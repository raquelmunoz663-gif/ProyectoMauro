<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* 📘 Cuadro del cuento */
    #menu {
      position: fixed;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 15px;
      color: white;
      font-family: sans-serif;
      z-index: 999;
      text-align: center;
      width: 85%;
      max-width: 420px;
      display: none;
    }

    #menu button {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 10px;
      background: #1e90ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #menu button:hover {
      background: #4682b4;
    }

    #story-box {
      margin-top: 10px;
      font-size: 19px;
      line-height: 1.5;
    }
    

    /* 🧭 Mensaje escaneo */
    #scan-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 18px;
      border-radius: 12px;
      color: white;
      font-family: sans-serif;
      z-index: 1000;
      text-align: center;
    }

    #scan-message img {
      display: block;
      margin: 10px auto 0 auto;
      max-width: 150px;
      border-radius: 8px;
    }

    /* 🌙 Pantalla inicio */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #000428, #004e92);
      color: white;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2000;
      text-align: center;
    }

    #start-content img#cover-image {
      width: 200px;
      max-width: 70%;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    #start-content h1 {
      font-size: 2em;
      margin: 10px 0 5px 0;
    }

    #start-content p {
      margin-bottom: 15px;
      color: #cce7ff;
    }

    #start-content button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      background: #1e90ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #start-content button:hover {
      background: #4682b4;
    }

    /* 🌟 Créditos */
    #credits-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2100;
      justify-content: center;
      align-items: center;
    }

    #credits-box {
      background: white;
      color: black;
      padding: 20px 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
    }

    #credits-box h2 {
      margin-top: 0;
      color: #1e90ff;
    }

    #credits-box button {
      margin-top: 10px;
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #1e90ff;
      color: white;
      cursor: pointer;
    }

    #credits-box button:hover {
      background: #4682b4;
    }


    #audio-controls {

  position: fixed;

  bottom: 120px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 1200;

  display: flex;

  gap: 10px;
}

#audio-controls button {

  padding: 10px 15px;

  border: none;

  border-radius: 12px;

  background: #1e90ff;

  color: white;

  font-weight: bold;

  cursor: pointer;
}

#audio-controls button:hover {

  background: #4682b4;
}
  </style>
</head>

<body>

  <!-- 🌙 Pantalla inicio -->
  <div id="start-screen">
    <div id="start-content">

      <img src="./Portada.png" alt="Portada" id="cover-image">

      <h1>🌙 Mauro y la Luna</h1>

      <p>Un cuento interactivo con Realidad Aumentada</p>

      <button id="btnStartStory">Iniciar cuento</button>

      <button id="btnCredits">Créditos</button>

    </div>
  </div>

  <!-- 🌟 Créditos -->
  <div id="credits-modal">

    <div id="credits-box">

      <h2>Créditos</h2>

      <p><strong>Autor:</strong> Equipo dinamita</p>
      <p><strong>Modelado 3D:</strong> Sofi y Miguel</p>
      <p><strong>Historia:</strong> Ingrid</p>
      <p><strong>Arte:</strong> Lucy y Chucho</p>
      <p><strong>Desarrollo:</strong> Raquel</p>

      <button id="btnCloseCredits">Cerrar</button>

    </div>

  </div>

  <!-- 🧭 Escaneo -->
  <div id="scan-message">

    Escanea una página del cuento 📖

    <img id="scan-image" src="./Introduccion1.png">

  </div>

  <!-- 📘 Texto -->
  <div id="menu">

    <div id="story-box"></div>

    <div>

      <button id="btnPrev">⟵ Anterior</button>

      <button id="btnNext">Siguiente ⟶</button>

    </div>

  </div>

  <div id="audio-controls">

  <button id="btnPlay">▶️ Play</button>

  <button id="btnPause">⏸ Pause</button>

  <button id="btnReplay">🔁 Reiniciar</button>

</div>

  <!-- 🧱 ESCENA -->

    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Assets -->
    <a-assets>

      <a-asset-item id="PageModel1" src="./Introduccion 1.glb"></a-asset-item>
      <a-asset-item id="PageModel2" src="./Introduccion 2.glb"></a-asset-item>

    <!-- 💡 Luz -->
    <a-light type="ambient" intensity="1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target-page1" mindar-image-target="targetIndex: 0">

          scale="0.08 0.08 0.15"

      <a-entity class="inter-model" id="modelA" gltf-model="#ModelA" visible="true" position="0 0 0" scale="0.05 0.05 0.05" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear"> </a-entity>
      <a-entity class="inter-model" id="modelB" gltf-model="#ModelB" visible="false" position="0 0 0" scale="0.05 0.05 0.05" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear"> </a-entity>
      <a-entity class="inter-model" id="modelC" gltf-model="#ModelC" visible="false" position="0 0 0" scale="0.05 0.05 0.05" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear"> </a-entity>
      
    </a-entity>

    const storyPages = {
      0: [ 
        "En una tierra muy lejana, más allá de todo lo que conocemos,", 
          " vivía un diminuto ratón de nombre Mauro.", 
          "Vivía en una madriguera cálida debajo de un gran y viejo roble.", 
          "Como todas las noches, salió en busca de semillas para saciar su gran apetito.",
          "Sin embargo, más allá de las copas de los árboles,",

         ],

        "El lugar era nada más y nada menos que la madriguera de una serpiente.",

        " explorando su nuevo escondite chocó de frente con ella. ", 
        "La serpiente extasiada por el nuevo inquilino, se adelantó a cubrir la entrada con su largo cuerpo.", 
        "¿Qué trae a esssssste pequeño ratón a mi casa? - ", 
        "preguntó con una malévola sonrisa ",

      5: [
        "Una noche de luna llena, tan fría y silenciosa, ",

        "Tal vez no te está mirando para juzgarte… sino para darte compañía",

      6: [ 
        "Mauro se quedó pensando por un momento, dudoso. ", 
        "Se permitió mirar al cielo y logró admirarla en su vasto esplendor.", 
        "Un pensamiento en él cambió, el miedo que sentía se transformó en admiración.", 
        "Por esa noche y todas las siguientes decidió no volver a esconderse.", 
        "Se sentó en el pasto y al voltear al cielo se encontró acompañado.", 
        "La Luna, muy despacio, se iluminó aún más fuerte… ", 
        "como si le devolviera la atención y con ella una sonrisa.", 
        "Y Mauro, por primera vez, le sonrió también.",
        "Desde entonces, el pequeño Mauro aprendió algo importante a pesar de sentir miedo algunas veces: ", 
        "La valentía no es no tener miedo…", 
        "es atreverse a mirar al miedo a los ojos y sonreírle de vuelta." 
      ], 
      7: [ "Una noche de luna llena, tan fría y silenciosa,", 
          "Mauro corría despavorido nuevamente. Distraído y ansioso por esconderse,", 
          "no reparó en notar el enorme agujero que había delante suyo. ", 
          "El pequeño ratón cayó por una de las paredes hasta tocar el suelo.", 
          "Aturdido por el impacto, con el corazón al mil por hora, intentó escalar para salir sin éxito alguno.", 
          "Lo aterrador para él no era el agujero, ni el hecho de estar atrapado,", 
          " era que al mirar hacia arriba, la luna abarcaba la única salida. ", 
          "Lo único que los separaba era un pedazo de cielo y para Mauro eso era lo peor. ", 
          "En ese momento, el tiempo para Mauro pareció detenerse.", 
          "Los minutos se sentían como horas, había gastado sus pocas fuerzas en intentar escapar del agujero.", 
          "Resignado, se aferró a la poca luz que aún tenía, aunque fuera de ella.", 
          " A pesar de ser incómoda y juzgona, empezaba a sentir algo diferente, algo parecido a la compañía. ", 
          "Al pasar de una hora, la luna había avanzado lo suficiente para ya no cubrir el agujero.",

          "Si había algo que nuestro ratón odiaba más que sentirse observado, era la oscuridad.", 
          "Quizá empezó a extrañarla, la luz que lo cubría y la compañía que le brindaba.", 
          "Los pensamientos negativos que por mucho tiempo sostuvo, se disiparon con el pasar de las horas. "
         ], 
      
      8: [ "La luz del amanecer fue lo que despertó a Mauro.",

          "Ahora poseía energía suficiente para intentar subir a la superficie. ", 
          " Con el sol saludando en el éste, y después de un par de intentos más por fin lo logró. ", 
          "El aire se sentía diferente. Mauro recordó entonces a la luna tan grande, blanca y redonda… ", 
          "Ahora, en vez de que su corazón sintiera miedo, sintió una especie de paz y de añoranza.", 
          "No lo había experimentado antes, era raro,", 
          " pero no tan raro cómo las ansias que tenía de que oscureciera sólo para verla brillar una vez más." ]

    // Variables

    const storyBox = document.querySelector("#story-box");
    const menu = document.querySelector("#menu");
    const scanMessage = document.querySelector("#scan-message");

    const btnNext = document.querySelector("#btnNext");
    const btnPrev = document.querySelector("#btnPrev");

let interModels = [];

window.addEventListener("load", () => {

  interModels = [
    document.querySelector("#modelA"),
    document.querySelector("#modelB"),
    document.querySelector("#modelC")
  ];

});

let currentModelIndex = 0;

function updateIntermedioModels() {

  if (!interModels.length) return;

  interModels.forEach((m, i) => {

    if (m) {
      m.setAttribute("visible", i === currentModelIndex);
    }

  });
}


    let currentPage = null;
    let currentFragment = 0;

    // Mostrar texto

    function showCurrentFragment() {

      if (currentPage !== null) {

        const fragments = storyPages[currentPage];

        storyBox.innerText = fragments[currentFragment];

        menu.style.display = "block";

        scanMessage.style.display = "none";
      }
    }

    // Ocultar

    function hideAll() {

      menu.style.display = "none";

      scanMessage.style.display = "block";
    }

    // Navegación

   btnNext.addEventListener("click", () => {
      if (isAudioPlaying) return;

  if (currentPage !== null) {

    if (currentPage === 2) {
      currentModelIndex = (currentModelIndex + 1) % interModels.length;
      updateIntermedioModels();
      return;
    }

    const fragments = storyPages[currentPage];
    currentFragment = (currentFragment + 1) % fragments.length;
    showCurrentFragment();
  }
});


btnPrev.addEventListener("click", () => {
   if (isAudioPlaying) return;

  if (currentPage !== null) {

    if (currentPage === 2) {
      currentModelIndex = (currentModelIndex - 1 + interModels.length) % interModels.length;
      updateIntermedioModels();
      return;
    }

    const fragments = storyPages[currentPage];
    currentFragment = (currentFragment - 1 + fragments.length) % fragments.length;
    showCurrentFragment();
  }
});

    // Targets

function setupTargetEvents(id, pageIndex) {
  const el = document.querySelector(id);

el.addEventListener("targetFound", () => {

  currentPage = pageIndex;
  currentFragment = 0;

  showCurrentFragment();

   const audio = pageAudio[pageIndex];

if (audio) {
  audioPlayer.src = audio;
  audioPlayer.play();
  activateAutoText(pageIndex);
}

 if (pageIndex === 2) {

  console.log("INTERMEDIO ACTIVADO");

  currentModelIndex = 0;

  if (interModels.length > 0) {

    interModels.forEach(m => {
      if (m) m.setAttribute("visible", false);
    });

    if (interModels[0]) {
      interModels[0].setAttribute("visible", true);
    }

  }
}
   
  console.log("Target encontrado:", pageIndex);
});

  el.addEventListener("targetLost", () => {
    currentPage = null;
    hideAll();
    console.log("Target perdido:", pageIndex);
    audioPlayer.pause();
audioPlayer.currentTime = 0;
stopAutoAdvance();
isAudioPlaying = false;
  });

 
}

    function activateAutoText(pageIndex) {

  const timings = storyTimings[pageIndex];

  if (!timings) return;

  audioPlayer.ontimeupdate = () => {

    const currentTime = audioPlayer.currentTime;

    for (let i = timings.length - 1; i >= 0; i--) {

      if (currentTime >= timings[i].time) {

        storyBox.innerText = timings[i].text;

        break;
      }
    }
  };
}


    setupTargetEvents("#target-page1", 0);
    setupTargetEvents("#target-page2", 1);
    setupTargetEvents("#target-page3", 2);
    setupTargetEvents("#target-page4", 3);
    setupTargetEvents("#target-page5", 4);
    setupTargetEvents("#target-page6", 5);
    setupTargetEvents("#target-page7", 6);
    setupTargetEvents("#target-page8", 7);
    setupTargetEvents("#target-page9", 8);

    // Rotación imágenes escaneo

    const scanImage = document.querySelector("#scan-image");

    const scanImages = [
      "./Introduccion1.png",
      "./Introduccion2.png",
      "./Intermedio.png",
      "./FinalA1.png",
      "./Final A 2.png",
      "./Final B1.jpg",
      "./Final B2.jpg",
      "./Final C1.jpg",
      "./Final C2.jpg"
    ];

    let scanIndex = 0;

    setInterval(() => {

      scanIndex = (scanIndex + 1) % scanImages.length;

      scanImage.src = scanImages[scanIndex];

    }, 2000);

    // Pantalla inicio

    const startScreen = document.getElementById("start-screen");

    const creditsModal = document.getElementById("credits-modal");

    const btnStartStory = document.getElementById("btnStartStory");

    const btnCredits = document.getElementById("btnCredits");

    const btnCloseCredits = document.getElementById("btnCloseCredits");

    const btnPlay = document.querySelector("#btnPlay");
const btnPause = document.querySelector("#btnPause");
const btnReplay = document.querySelector("#btnReplay");

    btnPlay.addEventListener("click", () => {

  audioPlayer.play();

});

    
    btnPause.addEventListener("click", () => {

  audioPlayer.pause();

});

    btnReplay.addEventListener("click", () => {

  audioPlayer.currentTime = 0;
  audioPlayer.play();

});

    
    // Inicial

    scanMessage.style.display = "none";

    menu.style.display = "none";

    // Iniciar cuento

    btnStartStory.addEventListener("click", () => {

      startScreen.style.display = "none";

      scanMessage.style.display = "block";
    });

    // Créditos

    btnCredits.addEventListener("click", () => {

      creditsModal.style.display = "flex";
    });

    btnCloseCredits.addEventListener("click", () => {

      creditsModal.style.display = "none";
    });

  </script>
