
<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    /* 📘 Cuadro del cuento */
    #menu {
      position: fixed;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 20px;
      border-radius: 15px;
      color: white;
      font-family: sans-serif;
      z-index: 999;
      text-align: center;
      width: 85%;
      max-width: 420px;
      display: none;
    }

    #menu button {
      margin: 5px;
      padding: 8px 15px;
      border: none;
      border-radius: 10px;
      background: #1e90ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #menu button:hover {
      background: #4682b4;
    }

    #story-box {
      margin-top: 10px;
      font-size: 19px;
      line-height: 1.5;
    }

    /* 🧭 Mensaje escaneo */
    #scan-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      padding: 12px 18px;
      border-radius: 12px;
      color: white;
      font-family: sans-serif;
      z-index: 1000;
      text-align: center;
    }

    #scan-message img {
      display: block;
      margin: 10px auto 0 auto;
      max-width: 150px;
      border-radius: 8px;
    }

    /* 🌙 Pantalla inicio */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #000428, #004e92);
      color: white;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 2000;
      text-align: center;
    }

    #start-content img#cover-image {
      width: 200px;
      max-width: 70%;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    #start-content h1 {
      font-size: 2em;
      margin: 10px 0 5px 0;
    }

    #start-content p {
      margin-bottom: 15px;
      color: #cce7ff;
    }

    #start-content button {
      margin: 5px;
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      background: #1e90ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #start-content button:hover {
      background: #4682b4;
    }

    /* 🌟 Créditos */
    #credits-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 2100;
      justify-content: center;
      align-items: center;
    }

    #credits-box {
      background: white;
      color: black;
      padding: 20px 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 300px;
    }

    #credits-box h2 {
      margin-top: 0;
      color: #1e90ff;
    }

    #credits-box button {
      margin-top: 10px;
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: #1e90ff;
      color: white;
      cursor: pointer;
    }

    #credits-box button:hover {
      background: #4682b4;
    }
  </style>
</head>

<body>

  <!-- 🌙 Pantalla inicio -->
  <div id="start-screen">
    <div id="start-content">

      <img src="./Portada.png" alt="Portada" id="cover-image">

      <h1>🌙 Mauro y la Luna</h1>

      <p>Un cuento interactivo con Realidad Aumentada</p>

      <button id="btnStartStory">Iniciar cuento</button>

      <button id="btnCredits">Créditos</button>

    </div>
  </div>

  <!-- 🌟 Créditos -->
  <div id="credits-modal">

    <div id="credits-box">

      <h2>Créditos</h2>

      <p><strong>Autor:</strong> Equipo dinamita</p>
      <p><strong>Modelado 3D:</strong> Sofi y Miguel</p>
      <p><strong>Historia:</strong> Ingrid</p>
      <p><strong>Arte:</strong> Lucy y Chucho</p>
      <p><strong>Desarrollo:</strong> Raquel</p>

      <button id="btnCloseCredits">Cerrar</button>

    </div>

  </div>

  <!-- 🧭 Escaneo -->
  <div id="scan-message">

    Escanea una página del cuento 📖

    <img id="scan-image" src="./Introduccion1.png">

  </div>

  <!-- 📘 Texto -->
  <div id="menu">

    <div id="story-box"></div>

    <div>

      <button id="btnPrev">⟵ Anterior</button>

      <button id="btnNext">Siguiente ⟶</button>

    </div>

  </div>

  <!-- 🧱 ESCENA -->
  <a-scene
    mindar-image="imageTargetSrc: ./cuento.mind; maxTrack: 1"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Assets -->
    <a-assets>

      <a-asset-item id="PageModel1" src="./Introduccion 1.glb"></a-asset-item>
      <a-asset-item id="PageModel2" src="./Introduccion 2.glb"></a-asset-item>

      <a-asset-item id="PageModel4" src="./Final_A_1.glb"></a-asset-item>
      <a-asset-item id="PageModel5" src="./Final_A_2.glb"></a-asset-item>

      <a-asset-item id="PageModel6" src="./Final_B_1.glb"></a-asset-item>
      <a-asset-item id="PageModel7" src="./Final_B_2.glb"></a-asset-item>

      <a-asset-item id="PageModel8" src="./Final C1.glb"></a-asset-item>
      <a-asset-item id="PageModel9" src="./Final C2.glb"></a-asset-item>

    </a-assets>

    <!-- 💡 Luz -->
    <a-light type="ambient" intensity="1"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- INTRODUCCION 1 -->
    <a-entity id="target-page1" mindar-image-target="targetIndex: 0">

      <a-entity
          gltf-model="#PageModel1"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>


    </a-entity>

    <!-- INTRODUCCION 2 -->
    <a-entity id="target-page2" mindar-image-target="targetIndex: 1">

     <a-entity
          gltf-model="#PageModel2"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

    <!-- INTERMEDIO -->
    <a-entity id="target-page3" mindar-image-target="targetIndex: 2">
    </a-entity>

    <!-- FINALA1 -->
    <a-entity id="target-page4" mindar-image-target="targetIndex: 3">

     <a-entity
          gltf-model="#PageModel4"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

    <!-- FINALA2 -->
    <a-entity id="target-page5" mindar-image-target="targetIndex: 4">

     <a-entity
          gltf-model="#PageModel5"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

    <!-- FINALB1 -->
    <a-entity id="target-page6" mindar-image-target="targetIndex: 5">

    <a-entity
          gltf-model="#PageModel6"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

    <!-- FINALB2 -->
    <a-entity id="target-page7" mindar-image-target="targetIndex: 6">

      <a-entity
          gltf-model="#PageModel7"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

    <!-- FINALC1 -->
    <a-entity id="target-page8" mindar-image-target="targetIndex: 7">

    <a-entity
          gltf-model="#PageModel8"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

    <!-- FINALC2 -->
    <a-entity id="target-page9" mindar-image-target="targetIndex: 8">

     <a-entity
          gltf-model="#PageModel9"
          position="0 0 0"
          scale="0.15 0.15 0.15">
        </a-entity>

    </a-entity>

  </a-scene>

  <script>

    // 📖 Texto del cuento

    const storyPages = {
      0: [ 
        "En una tierra muy lejana, más allá de todo lo que conocemos,", 
          " vivía un diminuto ratón de nombre Milo.", 
          "Vivía en una madriguera cálida debajo de un gran y viejo roble.", 
          "Como todas las noches, salió en busca de semillas para saciar su gran apetito.",
          "in embargo, más allá de las copas de los árboles,", 
          "había algo que lo asustaba en cada una de sus exploraciones nocturnas: la luna." 
         ], 
      1: [ 
        "Grande, tan blanca como la nieve y redonda igual que el sol,", 
          "ella lo miraba desde las alturas. ", 
          " Por su brillo tan intenso, deslumbrante, Milo la sentía amenazante,", 
          "juzgona e inquietante.", "— Seguro se ríe de mí porque soy pequeño… —", 
          "pensaba mientras corría a esconderse bajo unos frondosos arbustos, temeroso."
         ], 
      2: 
        [ 
          "(A) Entrar a una madriguera para resguardarse", 
          "(B) Ir al bosque de las luciérnagas", 
          "(C) Seguir corriendo" 
        ], 
      3: [ 
        "Una noche de luna llena, tan fría y silenciosa,", 
        "Milo corría despavorido nuevamente.", 
        "Distraído y ansioso por esconderse, entró al primer lugar que consideró como seguro. ", 
        "Algo que sellaría su destino.", 
        "El lugar era nada más y nada menos que la madriguera de una serpiente.", 
        " Pero eso era algo que Milo desconocía, al menos hasta que, ", 
        " explorando su nuevo escondite chocó de frente con ella. ", 
        "La serpiente extasiada por el nuevo inquilino, se adelantó a cubrir la entrada con su largo cuerpo.", 
        "¿Qué trae a esssssste pequeño ratón a mi casa? - ", 
        "preguntó con una malévola sonrisa ", 
        " - Bienvenido, ponte cómodo. Ssse ve que estás muy cansssssado. ", 
        "La Luna me observa, me sigue a dónde quiera que voy y me siento juzgado —", 
        "susurró Milo temblando. ", "No me digassss. Pobrecito chiquitín. ", 
        "No te preocupessss por ella, aquí no puede hacerte daño, no mientras yo esté contigo. " 
      ], 
      4: [ 
        "La serpiente se enroscó alrededor del ratón en lo que parecía ser una especie de abrazo", 
        "Milo, al notar los colmillos de la serpiente asomarse, intentó soltarse del agarre, ", 
        "argumentando que tenía que seguir buscando su comida… pero era demasiado tarde.", 
        "Aquí, la luna nunca más te va a juzgar, pequeño. ", 
        "Y en un instante, la serpiente enguyó al ratón. ",
        "Dejando sólo mechones de pelo volando por el lugar. ", 
        " Y tal como lo dijo, la luna no lo volvería a juzgar porque ahora Milo estaba con ella. " 
      ], 
      5: [
        "Una noche de luna llena, tan fría y silenciosa, ", 
        " Milo corría despavorido nuevamente. Distraído y ansioso por esconderse,",
        "tropezó con una luciérnaga que descansaba tranquilamente sobre una piedra, brillando.", 
        "—¿Por qué corres así, ratoncito? —preguntó la luciérnaga.", 
        "—La Luna, me observa, me sigue a dónde quiera que voy y me siento juzgado —susurró Milo temblando.", 
        "La luciérnaga soltó una risita tintineante.", 
        "—¿Y qué tiene de malo que alguien te observe? ", 
        "Tal vez no te está mirando para juzgarte… sino para darte compañía", 
        "¿No lo habías pensado, chiquitín? " ],
      6: [ 
        "Milo se quedó pensando por un momento, dudoso. ", 
        "Se permitió mirar al cielo y logró admirarla en su vasto esplendor.", 
        "Un pensamiento en él cambió, el miedo que sentía se transformó en admiración.", 
        "Por esa noche y todas las siguientes decidió no volver a esconderse.", 
        "Se sentó en el pasto y al voltear al cielo se encontró acompañado.", 
        "La Luna, muy despacio, se iluminó aún más fuerte… ", 
        "como si le devolviera la atención y con ella una sonrisa.", 
        "Desde entonces, el pequeño Milo aprendió algo importante a pesar de sentir miedo algunas veces: ", 
        "La valentía no es no tener miedo…", "es atreverse a mirar al miedo a los ojos y sonreírle de vuelta." 
      ], 
      7: [ "Una noche de luna llena, tan fría y silenciosa,", 
          "Milo corría despavorido nuevamente. Distraído y ansioso por esconderse,", 
          "no reparó en notar el enorme agujero que había delante suyo. ", 
          "El pequeño ratón cayó por una de las paredes hasta tocar el suelo.", 
          "Aturdido por el impacto, con el corazón al mil por hora, intentó escalar para salir sin éxito alguno.", 
          "Lo aterrador para él no era el agujero, ni el hecho de estar atrapado,", 
          " era que al mirar hacia arriba, la luna abarcaba la única salida. ", 
          "Lo único que los separaba era un pedazo de cielo y para Milo eso era lo peor. ", 
          "En ese momento, el tiempo para Milo pareció detenerse.", 
          "Los minutos se sentían como horas, había gastado sus pocas fuerzas en intentar escapar del agujero.", 
          "Resignado, se aferró a la poca luz que aún tenía, aunque fuera de ella.", 
          " A pesar de ser incómoda y juzgona, empezaba a sentir algo diferente, algo parecido a la compañía. ", 
          "Al pasar de una hora, la luna había avanzado lo suficiente para ya no cubrir el agujero.", 
          "Con el pasar de los minutos dejó de avistarse, dejándolo completamente a oscuras.", 
          "Si había algo que nuestro ratón odiaba más que sentirse observado, era la oscuridad.", 
          "Quizá empezó a extrañarla, la luz que lo cubría y la compañía que le brindaba.", 
          "Los pensamientos negativos que por mucho tiempo sostuvo, se disiparon con el pasar de las horas. "
         ], 
      
      8: [ "La luz del amanecer fue lo que despertó a Milo.", 
          "No recordaba haberse dormido, pero realmente se encontraba feliz de no estar a mitad de la noche con el sonido de su respiración cómo su único amigo. ", 
          "Ahora poseía energía suficiente para intentar subir a la superficie. ", 
          " Con el sol saludando en el éste, y después de un par de intentos más por fin lo logró. ", 
          "El aire se sentía diferente. Milo recordó entonces a la luna tan grande, blanca y redonda… ", 
          "Ahora, en vez de que su corazón sintiera miedo, sintió una especie de paz y de añoranza.", 
          "No lo había experimentado antes, era raro,", 
          " pero no tan raro cómo las ansias que tenía de que oscureciera sólo para verla brillar una vez más." ]

    };

    // Variables

    const storyBox = document.querySelector("#story-box");
    const menu = document.querySelector("#menu");
    const scanMessage = document.querySelector("#scan-message");

    const btnNext = document.querySelector("#btnNext");
    const btnPrev = document.querySelector("#btnPrev");

    let currentPage = null;
    let currentFragment = 0;

    // Mostrar texto

    function showCurrentFragment() {

      if (currentPage !== null) {

        const fragments = storyPages[currentPage];

        storyBox.innerText = fragments[currentFragment];

        menu.style.display = "block";

        scanMessage.style.display = "none";
      }
    }

    // Ocultar

    function hideAll() {

      menu.style.display = "none";

      scanMessage.style.display = "block";
    }

    // Navegación

    btnNext.addEventListener("click", () => {

      if (currentPage !== null) {

        const fragments = storyPages[currentPage];

        currentFragment =
          (currentFragment + 1) % fragments.length;

        showCurrentFragment();
      }
    });

    btnPrev.addEventListener("click", () => {

      if (currentPage !== null) {

        const fragments = storyPages[currentPage];

        currentFragment =
          (currentFragment - 1 + fragments.length) % fragments.length;

        showCurrentFragment();
      }
    });

    // Targets

    function setupTargetEvents(id, pageIndex) {

      const el = document.querySelector(id);

      el.addEventListener("targetFound", () => {

        currentPage = pageIndex;

        currentFragment = 0;

        showCurrentFragment();

        console.log("Target encontrado:", pageIndex);
      });

      el.addEventListener("targetLost", () => {

        currentPage = null;

        hideAll();

        console.log("Target perdido:", pageIndex);
      });
    }

    setupTargetEvents("#target-page1", 0);
    setupTargetEvents("#target-page2", 1);
    setupTargetEvents("#target-page3", 2);
    setupTargetEvents("#target-page4", 3);
    setupTargetEvents("#target-page5", 4);
    setupTargetEvents("#target-page6", 5);
    setupTargetEvents("#target-page7", 6);
    setupTargetEvents("#target-page8", 7);
    setupTargetEvents("#target-page9", 8);

    // Rotación imágenes escaneo

    const scanImage = document.querySelector("#scan-image");

    const scanImages = [
      "./Introduccion1.png",
      "./Introduccion2.png",
      "./Intermedio.png",
      "./FinalA1.png",
      "./FinalA2.png",
      "./FinalB1.png",
      "./FinalB2.png",
      "./FinalC1.png",
      "./FinalC2.png"
    ];

    let scanIndex = 0;

    setInterval(() => {

      scanIndex = (scanIndex + 1) % scanImages.length;

      scanImage.src = scanImages[scanIndex];

    }, 2000);

    // Pantalla inicio

    const startScreen = document.getElementById("start-screen");

    const creditsModal = document.getElementById("credits-modal");

    const btnStartStory = document.getElementById("btnStartStory");

    const btnCredits = document.getElementById("btnCredits");

    const btnCloseCredits = document.getElementById("btnCloseCredits");

    // Inicial

    scanMessage.style.display = "none";

    menu.style.display = "none";

    // Iniciar cuento

    btnStartStory.addEventListener("click", () => {

      startScreen.style.display = "none";

      scanMessage.style.display = "block";
    });

    // Créditos

    btnCredits.addEventListener("click", () => {

      creditsModal.style.display = "flex";
    });

    btnCloseCredits.addEventListener("click", () => {

      creditsModal.style.display = "none";
    });

  </script>

</body>

</html>
